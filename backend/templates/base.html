<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Navidrome Stats{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="{{ url_for('static',path='css/style.css') }}">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="/">🎵 Navidrome Stats</a>
      <div class="navbar-nav ms-auto">
        <a class="nav-link" href="/">Übersicht</a>
        <a class="nav-link" href="/compare">Vergleich</a>
      </div>
    </div>
  </nav>

  {% if use_sample_data %}
  <div class="alert alert-warning alert-dismissible mb-0 rounded-0" role="alert">
    <strong>Sample-Daten aktiv.</strong>
    Kein Navidrome-Volume gemountet (<code>{{ db_path }}</code> nicht gefunden).
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>
  {% endif %}

  <main class="container py-4">
    {% block content %}{% endblock %}
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script type="module" src="{{ url_for('static',path='js/charts.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
