[project]
name = "navidrome-stats"
version = "0.1.0"
description = "Web App to check what is going on in navidrome"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi-babel>=1.0.0",
    "fastapi[standard]>=0.136.3",
    "flask==3.1.0",
    "gunicorn==23.0.0",
    "jinja2>=3.1.6",
    "sqlalchemy>=2.0.50",
]


[dependency-groups]
dev = [
    "babel>=2.18.0",
    "httpx2>=0.1.0",
    "pytest>=9.0.3",
    "ruff>=0.15.16",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]


[tool.ruff]
target-version = "py312"
line-length = 90
extend-exclude = ["alembic/versions/"]

[tool.ruff.lint]
select = [
	"E",      # pycodestyle errors
	"W",      # pycodestyle warnings
	"F",      # pyflakes
	"N",      # pep8 naming
	"I",      # isort
	"B",      # flake8-bugbear
	"C4",     # flake8-comprehensions
	"UP",     # pyupgrade
	"ARG001", # unused arguments in functions
	"ASYNC",  # flake8 async
	"LOG",    # flake8 logging
	"ANN",    # flake8 annotations,
]
ignore = [
	#"B904",   # raise error in try/except
	"B008",   # call Depends() in parameter default
	"ANN002",
	"N818",   # Error suffix for exceptions
]

[tool.ruff.lint.per-file-ignores]
"app/api/html_routes.py" = ["ANN201"]
"app/api/i18n.py" = ["ANN201"]
"app/api/routes.py" = ["ANN201"]
"tests/*.py" = ["ANN001", "ANN201"]
# "extra/*" = ["E501"]
# "app/models.py" = ["E501"]
#"tests/conftest.py" = ["E402", "N806"]
