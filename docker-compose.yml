services:
  navidrome-stats:
    image: ghcr.io/sirtheta/navidrome-stats:latest
    #build: ./backend
    container_name: navidrome_stats
    ports:
      - "${HOST_PORT:-8080}:8000"
    volumes:
      - "${NAVIDROME_DB_PATH:-/opt/navidrome/data}:/data:ro"
    environment:
      - NAVIDROME_DB=/data/navidrome.db
      - FLASK_DEBUG=${FLASK_DEBUG:-false}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 5s
      retries: 3
